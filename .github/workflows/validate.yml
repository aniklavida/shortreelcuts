name: Validate repository

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/STRUCTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|/home/[^/]+/|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|ntn_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

      - name: Reject committed media artefacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -path ./.git -prune -o \
            \( -name '*.mp4' -o -name '*.mp3' -o -name '*.wav' -o -name '*.mov' \) -print | grep .; then
            echo "Rendered media must not be committed."
            exit 1
          fi

  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shortreelcuts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Worker tests
        env:
          SHORTREELCUTS_WORKER_E2E: "1"
          SHORTREELCUTS_DATABASE_URL: "postgresql://postgres:password@localhost:5432/shortreelcuts_test"
        run: npm run test:worker -- --fileParallelism=false

      - name: Report E2E test status
        run: |
          echo "Notice: E2E tests (test:e2e) are excluded from this CI job."
          echo "Reason: They require a real render pipeline (ffmpeg, external services), which is unsuitable for CI. They must be run locally or in a dedicated integration environment. This suite is explicitly skipped."
